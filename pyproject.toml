[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uptimepulse-backend"
version = "2.0.0"
description = "FastAPI uptime monitoring API and independent Python worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.38,<3",
  "psycopg[binary]>=3.2.5,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3", "bcrypt>=4.2,<6", "aiohttp>=3.12,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.15,<2", "aiosmtpd>=1.4.6,<2", "pip-audit>=2.8,<3"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["assets/*.png"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = ["backend/tests/"]
python_version = "3.12"
files = ["backend"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = ["integration: requires a disposable PostgreSQL database"]

